name: Omnitrix
options:
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Omnitrix:
    type: application
    platform: watchOS
    sources: [Omnitrix]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).omnitrix
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Omnitrix
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: YES
  OmnitrixTests:
    type: bundle.unit-test
    platform: watchOS
    sources: [OmnitrixTests]
    dependencies:
      - target: Omnitrix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).omnitrix.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Omnitrix:
    build:
      targets:
        Omnitrix: all
    test:
      targets:
        - OmnitrixTests
